# pnpm 12 的构建脚本白名单只看这里（pnpm-workspace.yaml 的 allowBuilds）；
# .npmrc / package.json 里的 onlyBuiltDependencies 已不被读取，写了也不会生效。
# 值为 false 表示明确拒绝该依赖的执行脚本，缺省未登记的依赖会被 pnpm 报错拦下（ERR_PNPM_IGNORED_BUILDS）。
allowBuilds:
  '@scarf/scarf': false
  # jest-resolve 的解析器，postinstall 选择本机平台绑定的原生二进制
  unrs-resolver: true
