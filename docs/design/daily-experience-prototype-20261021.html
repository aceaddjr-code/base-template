<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常体验交互原型</title>
<style>:root{font:16px/1.5 ui-monospace,"Microsoft Yahei",monospace;color:#201d1d;background:#fdfcfc}body{max-width:1000px;margin:32px auto;padding:0 16px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #646262}button,input{font:inherit;padding:10px 12px;border:1px solid #646262;border-radius:4px;background:#fdfcfc;color:inherit}button{cursor:pointer}button.primary{background:#201d1d;color:#fdfcfc}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{border:1px solid #ccc;padding:20px}label{display:block;margin:16px 0}input{box-sizing:border-box;width:100%}small,p.hint{color:#646262;font-size:14px}dialog{width:min(560px,calc(100vw - 48px));border:1px solid #646262;padding:24px;background:#fdfcfc}dialog::backdrop{background:#0005}.results button{display:block;width:100%;text-align:left;border-radius:0}.results button.active{background:#f1eeee;border-left:3px solid #201d1d}.error{color:#b42318}h2{font-size:20px}@media(max-width:640px){.cards{grid-template-columns:1fr}header{align-items:flex-start;gap:16px}}:focus-visible{outline:2px solid #0056b3;outline-offset:2px}</style>
<header><h1 style="font-size:24px">日常体验交互原型</h1><button id="search">搜索菜单 · Ctrl/⌘ K</button></header>
<p class="hint">独立演示，不连接账号接口。用于查看入口、字段反馈和菜单搜索交互。</p>
<div class="cards"><section><h2>个人中心 / 安全设置</h2><p>修改成功后旧会话失效，使用新密码重新登录。</p><form id="password"><label>原密码<input type="password" name="old" required autocomplete="off"></label><label>新密码<input type="password" name="next" required minlength="3" maxlength="72" autocomplete="off"><small>至少3位，UTF-8编码后最多72字节。</small></label><label>确认新密码<input type="password" name="confirm" required autocomplete="off"></label><p id="feedback" role="alert"></p><button class="primary">演示修改反馈</button></form></section><section><h2>菜单搜索</h2><p>仅显示当前账号可访问的页面。</p><p>名称、别名、路径均可匹配；方向键选择，Enter打开，Esc关闭。</p><p>最近访问按账号隔离，仅保存在当前浏览器会话。</p><p id="destination" role="status">点击顶栏“搜索菜单”体验。</p></section></div>
<dialog id="dialog"><form method="dialog" style="float:right"><button>关闭</button></form><h2>搜索菜单</h2><input id="query" aria-label="搜索菜单" placeholder="试试：账号、审计、消息"><p class="hint">↑ ↓ 选择 · Enter打开 · Esc关闭</p><div id="results" class="results"></div></dialog>
<script>const pages=[['用户管理','账号 人员','/system/users'],['操作日志','审计 操作记录','/system/logs'],['我的通知','消息 通知','/system/notifications'],['数据字典','选项','/system/dict']];const dialog=document.querySelector('#dialog'),query=document.querySelector('#query'),results=document.querySelector('#results');let selected=0,matched=pages;function draw(){matched=pages.filter(p=>p.join(' ').includes(query.value.trim()));selected=Math.min(selected,Math.max(matched.length-1,0));results.replaceChildren(...matched.map((p,i)=>{const b=document.createElement('button');b.textContent=p[0]+' · '+p[2];b.className=i===selected?'active':'';b.onclick=()=>{document.querySelector('#destination').textContent='演示打开：'+p[0]+' '+p[2];dialog.close()};return b}));if(!matched.length)results.textContent='没有匹配的可访问页面'}function show(){dialog.showModal();query.value='';selected=0;draw();query.focus()}document.querySelector('#search').onclick=show;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!e.isComposing){e.preventDefault();if(!dialog.open)show()}});query.oninput=()=>{selected=0;draw()};query.onkeydown=e=>{if(e.isComposing)return;if(['ArrowDown','ArrowUp'].includes(e.key)&&matched.length){e.preventDefault();selected=(selected+(e.key==='ArrowDown'?1:-1)+matched.length)%matched.length;draw()}if(e.key==='Enter'){e.preventDefault();results.querySelector('.active')?.click()}};document.querySelector('#password').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),next=f.get('next'),feedback=document.querySelector('#feedback');feedback.className='error';if(next!==f.get('confirm'))feedback.textContent='两次新密码不一致';else if(new TextEncoder().encode(next).length>72)feedback.textContent='新密码编码后不能超过72字节';else{feedback.className='';feedback.textContent='演示：修改成功后清空密码，退出旧会话并返回登录页。实际账号未发生变更。';e.target.reset()}};</script></html>
